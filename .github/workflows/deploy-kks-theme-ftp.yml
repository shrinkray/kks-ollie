# OPTIONAL: FTP hosts without SSH — run Actions → "Deploy kks-ollie FTP" manually.
# Repo root must be this theme folder (same as deploy-kks-theme.yml).
#
# --- Secrets ---
#   FTP_SERVER               Hostname only, e.g. ftp.example.com
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_THEME_REMOTE_PATH    Remote absolute path to theme root (no trailing slash)
#
# --- Variable ---
#   THEME_PATH               Defaults to "."; override if package.json is not at repo root

name: Deploy kks-ollie FTP (manual, optional)

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy-ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve theme directory
        id: theme
        run: |
          if [ -n "${{ vars.THEME_PATH }}" ]; then TP="${{ vars.THEME_PATH }}"
          else TP="."; fi
          test -f "$TP/package.json" || { echo "Set THEME_PATH or use a checkout whose root is the theme." >&2; exit 1; }
          echo "theme_path=$TP" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ steps.theme.outputs.theme_path }}/package-lock.json

      - name: Build
        working-directory: ${{ steps.theme.outputs.theme_path }}
        run: npm ci && npm run production

      - name: FTP upload dist/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ steps.theme.outputs.theme_path }}/dist/
          server-dir: ${{ secrets.FTP_THEME_REMOTE_PATH }}/dist/

      - name: FTP upload images/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ steps.theme.outputs.theme_path }}/images/
          server-dir: ${{ secrets.FTP_THEME_REMOTE_PATH }}/images/
