# Build kks-ollie on pushes to main, then rsync compiled assets to hosting.
#
# Lives under this theme folder — intended for a repo whose ROOT is kks-ollie.
# GitHub only loads workflows from /.github/workflows at repository root.
# If this file lives in a subfolder of your remote (e.g. full WordPress tree) but
# the repo root is above the theme, copy this workflow to <repo-root>/.github/workflows/
# or Actions will never run it.
#
# Build runs `npm run production` each deploy. The rsync step mirrors the **whole theme**
# directory to the server (PHP, scss, js, templates, changelog, dist/, images/, …), excluding
# heavy/dev-only paths—so production stays aligned with `main`, not only compiled CSS/JS.
#
# --- GitHub Secrets (repository → Settings → Secrets and variables → Actions) ---
#
# Required to actually deploy:
#   DEPLOY_HOST            SSH hostname, e.g. ssh.yourhost.com
#   DEPLOY_USER            SSH login user
#   DEPLOY_THEME_PATH      Absolute path on the server to theme root (no trailing slash)
#                         e.g. /home/user/public_html/wp-content/themes/kks-ollie
#   DEPLOY_SSH_PRIVATE_KEY Full private key (PEM / OpenSSH) for DEPLOY_USER
#   DEPLOY_KNOWN_HOSTS     Full known_hosts entry for the deploy host (pin the expected host key)
#                         e.g. "ssh.example.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI..."
#
# Optional:
#   DEPLOY_SSH_PORT        Port if not 22 (e.g. 2222)
#
# --- GitHub Variables (same page, “Variables” tab), optional ---
#
#   THEME_PATH             Defaults to "." (repo root). Set only if this workflow file is checked out
#                         from a monorepo and package.json lives under another path.

name: Deploy kks-ollie (build + rsync)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-kks-ollie
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve theme directory
        id: theme
        run: |
          if [ -n "${{ vars.THEME_PATH }}" ]; then
            TP="${{ vars.THEME_PATH }}"
          else
            TP="."
          fi
          if [ ! -f "$TP/package.json" ]; then
            echo "Expected theme at '$TP'; set Actions variable THEME_PATH to the folder containing package.json." >&2
            exit 1
          fi
          echo "theme_path=$TP" >> "$GITHUB_OUTPUT"
          echo "theme_path=$TP" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ steps.theme.outputs.theme_path }}/package-lock.json

      - name: npm ci && production build
        working-directory: ${{ steps.theme.outputs.theme_path }}
        env:
          CI: true
          # Omit NODE_ENV=production during npm ci: npm would skip devDependencies
          # (laravel-mix, webpack, sass, …), leaving `mix` missing → exit 127.
        run: npm ci --no-audit --no-fund && npm run production

      - name: Verify artifacts
        working-directory: ${{ steps.theme.outputs.theme_path }}
        run: |
          echo "Contents of dist/ after build:"
          ls -la dist || true
          test -f dist/koolkatscience.css || { echo "Missing dist/koolkatscience.css — check webpack.mix.js and build logs above." >&2; exit 1; }
          test -f dist/koolkatscience.js || { echo "Missing dist/koolkatscience.js — check webpack.mix.js and build logs above." >&2; exit 1; }

      - name: Upload dist artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: ${{ steps.theme.outputs.theme_path }}/dist/
          if-no-files-found: error

      - name: Check deploy secrets
        id: deploy_ready
        run: |
          set -euo pipefail
          missing=()
          [ -z "${{ secrets.DEPLOY_HOST }}" ] && missing+=("DEPLOY_HOST")
          [ -z "${{ secrets.DEPLOY_USER }}" ] && missing+=("DEPLOY_USER")
          [ -z "${{ secrets.DEPLOY_THEME_PATH }}" ] && missing+=("DEPLOY_THEME_PATH")
          [ -z "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" ] && missing+=("DEPLOY_SSH_PRIVATE_KEY")
          [ -z "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ] && missing+=("DEPLOY_KNOWN_HOSTS")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Deploy cannot run. Missing repository secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions → Secrets (repository secrets, not only environment)."
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "All required deploy secrets are set."
          echo "deploy_ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy theme to server via rsync
        if: steps.deploy_ready.outputs.deploy_ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_THEME_PATH: ${{ secrets.DEPLOY_THEME_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        working-directory: ${{ steps.theme.outputs.theme_path }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE=~/.ssh/kks_ollie_deploy
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          export RSYNC_RSH="ssh -i $KEY_FILE -p $PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_THEME_PATH}"
          # Mirror repo theme → server (not only dist/). Excludes keep payload small and avoid
          # clobbering Composer auth if present only on the server.
          rsync -avz --mkpath --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            --exclude='manifest.json' \
            --exclude='auth.json' \
            ./ "${TARGET}/"
          shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"
